substitutions:
  device_id: ble_proxy
  device_name: ble-proxy
  friendly_name: BLE Proxy

<<: !include {
  file: "common/networking.yaml",
  vars: {
    device_id: "${device_id}",
    wifi_ssid: !secret wifi_ssid,
    wifi_password: !secret wifi_password,
    wifi_ap_password: !secret wifi_ap_password,
    encryption_key: !secret ble_proxy_encryption_key,
    ota_password: !secret ble_proxy_ota_password,
  }
}

esphome:
  name: "${device_name}"
  comment: "${friendly_name}"

logger:

esp32:
  board: esp32dev

bluetooth_proxy: